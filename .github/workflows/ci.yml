name: Networkly CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      CRON_SECRET: ci-placeholder
      SOCIAL_TOKEN_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef
      OAUTH_STATE_SECRET: ci-placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Syntax checks
        run: npm run check
      - name: Production build
        run: npm run build
